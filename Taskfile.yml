version: "3"

vars:
  NPX: pnpm exec

includes:
  engine:
    taskfile: ./packages/tql-engine-zig
    dir: ./packages/tql-engine-zig
  grammar:
    taskfile: ./packages/tree-sitter-tql
    dir: ./packages/tree-sitter-tql
  goz:
    taskfile: ./packages/goz
    dir: ./packages/goz
  js:
    taskfile: ./packages/tql-js
    dir: ./packages/tql-js
  playground:
    taskfile: ./packages/playground
    dir: ./packages/playground

tasks:
  default: task --list

  install:
    desc: install
    cmd: pnpm install --frozen-lockfile

  fmt:
    desc: Format everything
    deps: [engine:fmt, goz:fmt]
    cmd: "{{.NPX}} biome check --write ."

  check:
    desc: Lint + type check
    deps: [playground:check]
    cmd: "{{.NPX}} biome check ."

  build:
    desc: Build grammar, engine, js, playground
    deps: [grammar:build, engine:build, js:build]
    cmds:
      - cp packages/tql-engine-zig/zig-out/bin/tql.wasm packages/playground/static/tql.wasm
      - cp packages/tql-engine-zig/zig-out/wasm-grammars/*.wasm packages/playground/static/
      - task: playground:build

  build-nix:
    desc: Build the playground entirely through nix
    cmds:
      - nix build .#tql-playground

  build-nix-assets:
    desc: Stage nix-built wasm assets for a local playground build
    cmds:
      - nix build .#tql-wasm-assets --out-link result-wasm
      - install -m644 result-wasm/*.wasm packages/playground/static/
      - task: js:build
      - task: playground:build

  test:
    desc: Run all tests
    deps: [grammar:test, engine:test, goz:test]

  clean:
    desc: Clean all build artifacts + node_modules
    deps: [grammar:clean, js:clean, playground:clean, engine:clean, goz:clean]
    cmd: rm -rf node_modules
