on:
  pull_request:

name: Benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    env:
      MACHINES: 6
      ITERATIONS: 3
      REGRESSION_PCT: 10
      SUITE: packages/tql-engine-zig/benchmarks/default.yaml
    outputs:
      machines: ${{ steps.plan.outputs.machines }}
      iterations: ${{ steps.plan.outputs.iterations }}
      regression_pct: ${{ steps.plan.outputs.regression_pct }}
      matrix: ${{ steps.plan.outputs.matrix }}
      grammars: ${{ steps.plan.outputs.grammars }}
      suite: ${{ steps.plan.outputs.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: packages/tql-engine-zig/benchmarks

      - name: Plan topology
        id: plan
        run: |
          matrix=$(jq -nc --argjson n "$MACHINES" '[range(1; $n + 1)] | {machine: .}')
          grammars=$(yq -r '[.benchmarks[].grammar] | unique | join(",")' "$SUITE")
          {
            echo "machines=$MACHINES"
            echo "iterations=$ITERATIONS"
            echo "regression_pct=$REGRESSION_PCT"
            echo "matrix=$matrix"
            echo "grammars=$grammars"
            echo "suite=$SUITE"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix"
          echo "$grammars"

  build:
    name: Build (${{ matrix.side }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: head
            ref: ${{ github.event.pull_request.head.sha }}
          - side: base
            ref: ${{ github.event.pull_request.base.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install
        run: task install

      - name: Build optimized cli
        run: >
          task engine:build-cli --
          --prefix "$HOME/.local"
          -Dtarget=x86_64-linux-musl
          -Dgrammars=${{ needs.setup.outputs.grammars }}
          -Doptimize=ReleaseFast
          --release=fast

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tql-${{ matrix.side }}
          path: ~/.local/bin/tql
          if-no-files-found: error

  run:
    name: Run (machine ${{ matrix.machine }})
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      ITERATIONS: ${{ needs.setup.outputs.iterations }}
      MACHINE: ${{ matrix.machine }}
      SUITE: ${{ needs.setup.outputs.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tql-head
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tql-base
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: packages/tql-engine-zig/benchmarks

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tql-*
          path: bin

      - name: Make binaries executable
        run: chmod +x bin/tql-head/tql bin/tql-base/tql

      - name: Run benchmarks
        run: |
          mkdir -p results/head results/base
          runner=tql-head/scripts/benchmark/run.sh
          head_suite=tql-head/$SUITE
          base_suite=tql-base/$SUITE

          if [ ! -f "$base_suite" ]; then
            base_suite=$head_suite
          fi

          "$runner" --tql bin/tql-head/tql --suite "$head_suite" --iterations "$ITERATIONS" \
            --cache corpora --out "results/head/$MACHINE.jsonl"
          "$runner" --tql bin/tql-base/tql --suite "$base_suite" --iterations "$ITERATIONS" \
            --cache corpora --out "results/base/$MACHINE.jsonl"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-machine-${{ matrix.machine }}
          path: results

  compare:
    name: Compare
    needs: [setup, run]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-machine-*
          path: artifacts
          merge-multiple: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tql
          sparse-checkout: scripts

      - name: Paired statistics
        id: stats
        env:
          REGRESSION_PCT: ${{ needs.setup.outputs.regression_pct }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          python3 tql/scripts/benchmark/compare.py \
            --head artifacts/head --base artifacts/base \
            --regression-pct "$REGRESSION_PCT" --base-ref "$BASE_SHA" \
            --markdown body.md || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find comment
        id: find
        uses: peter-evans/find-comment@v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- benchmark-result -->

      - name: Comment
        uses: peter-evans/create-or-update-comment@v5
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body-path: body.md
          edit-mode: replace

      - name: Check thresholds
        if: steps.stats.outputs.status != '0'
        run: |
          echo "::error::A benchmark regressed, exceeded its limit, or failed; see the report"
          exit 1
