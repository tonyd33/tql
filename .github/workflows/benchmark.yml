on:
  pull_request:

name: Benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  benchmark-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tql

      - uses: ./tql/.github/actions/setup
        with:
          path: tql

      - name: Install
        working-directory: tql
        run: task install

      - name: Setup bin
        run: >
          mkdir -p "$HOME/.local/bin" &&
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build optimized cli
        working-directory: tql
        run: >
          task engine:build-cli --
          --prefix "$HOME/.local"
          -Dgrammars=c
          -Doptimize=ReleaseFast
          --release=fast

      - name: Upload cli binary
        uses: actions/upload-artifact@v4
        with:
          name: tql-cli
          path: ~/.local/bin/tql
          retention-days: 1

  benchmark-run:
    needs: benchmark-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout Linux source tree
        uses: actions/checkout@v7
        with:
          repository: torvalds/linux
          ref: 24d479d26b25bce5faea3ddd9fa8f3a6c3129ea7
          path: linux

      - name: Download cli binary
        uses: actions/download-artifact@v4
        with:
          name: tql-cli
          path: ~/.local/bin

      - name: Setup bin
        run: >
          chmod +x "$HOME/.local/bin/tql" &&
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run query
        run: |
          tql query --grammar c --format json '
          . > function_definition as @fn
          | @fn > function_declarator as @fn_decl
          | @fn_decl > identifier as @name
          | @fn.body as @body
          | select(
            any(@body >> call_expression; ( .function | text() ) ~ /^(k|v|kv)(z|m|c|re)?alloc/) and
            any(@body >> goto_statement; ( .label | text() ) ~ /^(err|out)(_\w+)?$/)
          )
          | { @name }
          ' "$GITHUB_WORKSPACE/linux" | jq .stats | tee results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.run }}
          path: results.json
          retention-days: 1

  benchmark-check:
    needs: benchmark-run
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: results
          merge-multiple: false

      - name: Aggregate and check query time
        run: |
          times_ns=$(jq '.query_time_ns' results/*/results.json | sort -n)
          echo "Query times (ns):"
          echo "$times_ns"

          count=$(echo "$times_ns" | wc -l)
          median_ns=$(echo "$times_ns" | sed -n "$(( (count + 1) / 2 ))p")
          median_s=$(jq -n "$median_ns / 1000000000")
          limit_ns=35000000000

          echo "Median query time: ${median_s}s (limit: 35s) over $count runs"
          if [ "$median_ns" -ge "$limit_ns" ]; then
            echo "Median query time ${median_s}s exceeds 35s limit"
            exit 1
          fi
