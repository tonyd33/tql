on:
  pull_request:

name: Benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  benchmark-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tql

      - uses: ./tql/.github/actions/setup
        with:
          path: tql

      - name: Install
        working-directory: tql
        run: task install

      - name: Build optimized cli
        working-directory: tql
        run: >
          task engine:build-cli --
          --prefix "$HOME/.local"
          -Dtarget=x86_64-linux-musl
          -Dgrammars=c
          -Doptimize=ReleaseFast
          --release=fast

      - name: Upload cli binary
        uses: actions/upload-artifact@v7
        with:
          name: tql-cli
          path: ~/.local/bin/tql
          retention-days: 1
          archive: false

  benchmark-run:
    needs: benchmark-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout Linux source tree
        uses: actions/checkout@v7
        with:
          repository: torvalds/linux
          ref: 24d479d26b25bce5faea3ddd9fa8f3a6c3129ea7
          path: linux

      - name: Download cli binary
        uses: actions/download-artifact@v8
        with:
          name: tql-cli
          path: .

      - name: Setup bin
        run: ls -al && chmod +x tql && ls -al && file tql && ldd tql

      - name: Run query
        run: |
          ./tql query --grammar c --format json '
          . > function_definition as @fn
          | @fn > function_declarator as @fn_decl
          | @fn_decl > identifier as @name
          | @fn.body as @body
          | select(
            any(@body >> call_expression; ( .function | text() ) ~ /^(k|v|kv)(z|m|c|re)?alloc/) and
            any(@body >> goto_statement; ( .label | text() ) ~ /^(err|out)(_\w+)?$/)
          )
          | { @name }
          ' "$GITHUB_WORKSPACE/linux" | jq .stats | tee results.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.run }}
          path: results.json
          retention-days: 1

  benchmark-check:
    needs: benchmark-run
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: results
          merge-multiple: false

      - name: Aggregate and check query time
        run: |
          stats=$(jq -s '
            [.[].query_time_ns] | sort as $t
            | ($t | length) as $n
            | (add / $n) as $mean
            | (map((. - $mean) * (. - $mean)) | add / $n | sqrt) as $stddev
            | (if $n % 2 == 1 then $t[($n - 1) / 2]
               else ($t[$n / 2 - 1] + $t[$n / 2]) / 2
               end) as $median
            | {
                count: $n,
                times_ns: $t,
                mean_ns: $mean,
                median_ns: $median,
                stddev_ns: $stddev,
                limit_ns: 35000000000
              }
          ' results/*/results.json)

          echo "$stats" | jq '{
            count,
            times_s: (.times_ns | map(. / 1000000000)),
            mean_s: (.mean_ns / 1000000000),
            median_s: (.median_ns / 1000000000),
            stddev_s: (.stddev_ns / 1000000000)
          }'

          median_ns=$(echo "$stats" | jq '.median_ns')
          limit_ns=$(echo "$stats" | jq '.limit_ns')
          if [ "$(echo "$stats" | jq '.median_ns >= .limit_ns')" = "true" ]; then
            median_s=$(jq -n "$median_ns / 1000000000")
            echo "Median query time ${median_s}s exceeds 35s limit"
            exit 1
          fi
