on:
  pull_request:

name: Benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    env:
      MACHINES: 6
      ITERATIONS: 3
      LIMIT_S: 35
      REGRESSION_PCT: 10
    outputs:
      machines: ${{ steps.plan.outputs.machines }}
      iterations: ${{ steps.plan.outputs.iterations }}
      limit_s: ${{ steps.plan.outputs.limit_s }}
      regression_pct: ${{ steps.plan.outputs.regression_pct }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan topology
        id: plan
        run: |
          matrix=$(jq -nc --argjson n "$MACHINES" '[range(1; $n + 1)] | {machine: .}')
          {
            echo "machines=$MACHINES"
            echo "iterations=$ITERATIONS"
            echo "limit_s=$LIMIT_S"
            echo "regression_pct=$REGRESSION_PCT"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: Build (${{ matrix.side }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: head
            ref: ${{ github.event.pull_request.head.sha }}
          - side: base
            ref: ${{ github.event.pull_request.base.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install
        run: task install

      - name: Build optimized cli
        run: >
          task engine:build-cli --
          --prefix "$HOME/.local"
          -Dtarget=x86_64-linux-musl
          -Dgrammars=c
          -Doptimize=ReleaseFast
          --release=fast

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tql-${{ matrix.side }}
          path: ~/.local/bin/tql
          if-no-files-found: error

  run:
    name: Run (machine ${{ matrix.machine }})
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      ITERATIONS: ${{ needs.setup.outputs.iterations }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tql-*
          path: bin

      - name: Make binaries executable
        run: chmod +x bin/tql-head/tql bin/tql-base/tql

      - name: Checkout Linux source tree
        uses: actions/checkout@v7
        with:
          repository: torvalds/linux
          ref: 24d479d26b25bce5faea3ddd9fa8f3a6c3129ea7
          path: linux

      - name: Run query
        run: |
          mkdir -p results/head results/base
          workers=2
          query='
          . / function_definition as @fn
          | @fn / function_declarator as @fn_decl
          | @fn_decl / identifier as @name
          | @fn.body as @body
          | select(
            any(@body // call_expression; ( .function | text() ) ~ /^(k|v|kv)(z|m|c|re)?alloc/) and
            any(@body // goto_statement; ( .label | text() ) ~ /^(err|out)(_\w+)?$/)
          )
          | { @name }
          '
          for i in $(seq 1 "$ITERATIONS"); do
            # shuffle order so no possible cache pollution. need even machines
            if (( (i + MACHINE) % 2 == 0 )); then
              order="head base"
            else
              order="base head"
            fi
            for side in $order; do
              "$GITHUB_WORKSPACE/bin/tql-$side/tql" query --workers="$workers" --grammar=c --format=json "$query" \
                "$GITHUB_WORKSPACE/linux" \
                | jq --argjson m "$MACHINE" '.stats + {machine: $m}' \
                | tee "results/$side/$MACHINE-$i.json"
            done
          done

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-machine-${{ matrix.machine }}
          path: results

  compare:
    name: Compare
    needs: [setup, run]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-machine-*
          path: artifacts
          merge-multiple: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: tql
          sparse-checkout: scripts

      - name: Paired statistics
        id: stats
        run: |
          python3 tql/scripts/confidence_curve.py artifacts --json > stats.json
          {
            echo "json<<STATS_EOF"
            cat stats.json
            echo "STATS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Render, comment, and check thresholds
        uses: actions/github-script@v9
        env:
          STATS: ${{ steps.stats.outputs.json }}
          MACHINES: ${{ needs.setup.outputs.machines }}
          ITERATIONS: ${{ needs.setup.outputs.iterations }}
          LIMIT_S: ${{ needs.setup.outputs.limit_s }}
          REGRESSION_PCT: ${{ needs.setup.outputs.regression_pct }}
        with:
          script: |
            const stats = JSON.parse(process.env.STATS);
            const limitS = Number(process.env.LIMIT_S);
            const regressionPct = Number(process.env.REGRESSION_PCT);
            const machines = Number(process.env.MACHINES);
            const iterations = Number(process.env.ITERATIONS);

            const labels = {
              read_time_ns: "Read",
              parse_time_ns: "Parse",
              query_time_ns: "Query",
            };

            const toS = (ns) => Math.round((ns / 1e9) * 100) / 100;
            const pct = (x) => `${x >= 0 ? "+" : ""}${(x * 100).toFixed(1)}%`;
            // `speedup` is positive when head is faster; a delta reads the
            // other way round, so negate for display.
            const delta = (x) => pct(-x);
            const boundPhrase = (b) =>
              b >= 0
                ? `head is at least ${(b * 100).toFixed(1)}% faster`
                : `head is no more than ${(-b * 100).toFixed(1)}% slower`;

            const query = stats.fields.query_time_ns;
            const exceeded = query.head_median_ns >= limitS * 1e9;
            const regression = -query.speedup * 100;
            const regressed = regression >= regressionPct;

            const problems = [];
            if (exceeded) problems.push("⚠️ **Benchmark limit exceeded**");
            if (regressed)
              problems.push(
                `⚠️ **Query time regressed vs base by ${regression.toFixed(1)}%**`,
              );
            const status = problems.length
              ? problems.join("\n")
              : "✅ **Benchmark passed**";

            const rows = Object.entries(labels).map(([key, label]) => {
              const f = stats.fields[key];
              return `| ${label} | ${toS(f.head_median_ns)}s | ${toS(f.base_median_ns)}s | ${delta(f.speedup)} | ${boundPhrase(f.bound_95)} |`;
            });

            const perMachineRows = Object.entries(query.per_machine_speedup).map(
              ([m, s]) => `| ${m} | ${delta(s)} |`,
            );

            const curveRows = query.curve.map(
              (p) =>
                `| ${p.x >= 0 ? "+" : ""}${(p.x * 100).toFixed(0)}% | ${(p.confidence * 100).toFixed(1)}% |`,
            );

            const marker = "<!-- benchmark-result -->";
            const body = [
              marker,
              status,
              "",
              `Query time (limit ${limitS}s, regression threshold ${regressionPct}%).`,
              `${machines} machines × ${iterations} iterations per side; head and base run interleaved on the same machine.`,
              "Δ is the paired per-machine estimate, so cross-machine variance cancels.",
              `Base: \`${context.payload.pull_request.base.sha.slice(0, 7)}\``,
              "",
              "| Stage | Head median | Base median | Δ (paired) | 95% confidence |",
              "| --- | --- | --- | --- | --- |",
              ...rows,
              "",
              "<details><summary>Per-machine query delta</summary>",
              "",
              "| Machine | Δ |",
              "| --- | --- |",
              ...perMachineRows,
              "",
              "</details>",
              "",
              "<details><summary>Confidence curve</summary>",
              "",
              `Paired across ${query.machines} machines (df=${query.df}); sample size is machines, not runs, since same-machine runs are correlated.`,
              "",
              `- 95% confident: ${boundPhrase(query.bound_95)}`,
              `- 99% confident: ${boundPhrase(query.bound_99)}`,
              "",
              "| Head faster by at least | Confidence |",
              "| --- | --- |",
              ...curveRows,
              "",
              "Negative rows read as regressions: the +0% row is the confidence that head is faster at all.",
              "",
              "</details>",
            ].join("\n");

            await core.summary.addRaw(body).write();

            // Forks get a read-only token, so commenting can fail while the
            // job summary above still carries the report.
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`Could not post PR comment: ${err.message}`);
            }

            if (exceeded) {
              core.setFailed(
                `Median query time ${toS(query.head_median_ns)}s exceeds ${limitS}s limit`,
              );
            } else if (regressed) {
              core.setFailed(
                `Median query time regressed ${regression.toFixed(1)}% vs base (threshold ${regressionPct}%)`,
              );
            }
