name: Setup
description: Install Nix + load flake devenv into the job env via direnv.

inputs:
  path:
    description: Directory containing devenv
    required: false
    default: .
  cachix-auth-token:
    description: Cachix auth token
    required: false

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - uses: cachix/cachix-action@v17
      with:
        name: tql
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Install devenv.sh
      shell: bash
      run: nix profile add nixpkgs#devenv

    - name: Install direnv
      shell: bash
      run: nix profile add nixpkgs#direnv

    - name: Initialize shell
      shell: bash
      working-directory: ${{ inputs.path }}
      run: devenv test

    - name: Load shell into env
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        direnv allow .
        direnv export gha | tee -a "$GITHUB_ENV"
